# Input topics handled/muxed by twist_mux.
# For each topic:
# - topic   : input topic of geometry_msgs/msg/Twist type
# - timeout : seconds before an input is considered stale and zero speed is used
# - priority: range [0, 255], the higher the value the more priority the topic has

twist_mux:
  ros__parameters:
    topics:
      estop:
        topic: /GAZEBO/CHASSIS/diff_cont/cmd_vel_estop
        timeout: 0.5
        priority: 255
      # Same path the real rover uses: chassis_node -> CAN Drive_Power.
      can:
        topic: /GAZEBO/CHASSIS/diff_cont/cmd_vel_can
        timeout: 0.5
        priority: 200
      navigation:
        topic: /cmd_vel
        timeout: 0.5
        priority: 10
      joystick:
        topic: /GAZEBO/CHASSIS/diff_cont/cmd_vel_joy
        timeout: 0.5
        priority: 100
