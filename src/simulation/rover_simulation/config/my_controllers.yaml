# The Gazebo controller_manager runs in the /GAZEBO namespace. Its topics
# are regrouped by subsystem with remappings in ros2_control.xacro:
#   /GAZEBO/joint_states (shared)
#   /GAZEBO/ARM/...      (arm controller)
#   /GAZEBO/CHASSIS/...  (drive controller)
/GAZEBO/controller_manager:
  ros__parameters:
    update_rate: 30
    use_sim_time: true

    diff_cont:
      type: diff_drive_controller/DiffDriveController

    joint_broad:
      type: joint_state_broadcaster/JointStateBroadcaster

    arm_cont:
      type: forward_command_controller/ForwardCommandController

# Declared for every build; only spawned when robot_config:=arm_drivebase.
/GAZEBO/arm_cont:
  ros__parameters:
    joints:
      - arm_base_joint
      - arm_shoulder_joint
      - arm_elbow_joint
      - arm_wrist_bend_joint
      - arm_wrist_twist_joint
      - arm_gripper_joint
    interface_name: position

/GAZEBO/diff_cont:
  ros__parameters:

    publish_rate: 50.0

    base_frame_id: base_link

    left_wheel_names: ["left_front_wheel_joint","left_rear_wheel_joint"]
    right_wheel_names: ["right_front_wheel_joint","right_rear_wheel_joint"]
    wheel_separation: 0.58
    wheel_radius: 0.081674

    use_stamped_vel: false

    wheels_per_side: 2
