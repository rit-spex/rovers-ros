joy_node:
  ros__parameters:
    device_id: 0
    deadzone: 0.1
    autorepeat_rate: 20.0

teleop_node:
  ros__parameters:
    axis_linear:
      x: 1
    # Raw joy axis 1 is negative when the stick is pushed forward; invert it
    # so the rover drives forward in the stick's forward direction.
    scale_linear:
      x: -0.25
    scale_linear_turbo:
      x: -1.0
    
    axis_angular:
      yaw: 0
    scale_angular:
      yaw: 2.5
    scale_angular_turbo:
      yaw: 5.0
    
    enable_button: 4
    enable_turbo_button: 5

    require_enable_button: true